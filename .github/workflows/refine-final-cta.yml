name: Refine final project CTA
on:
  push:
    paths:
      - '.github/workflows/refine-final-cta.yml'
      - 'scripts/refine_final_cta.py'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply CTA refinement
        run: python scripts/refine_final_cta.py
      - name: Cleanup one-time files
        run: rm .github/workflows/refine-final-cta.yml scripts/refine_final_cta.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/refine-final-cta.yml scripts/refine_final_cta.py
          git commit -m "refine: redesign final project CTA section"
          git push