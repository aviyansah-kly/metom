name: Build reviewed legacy portfolio
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-reviewed-legacy-portfolio.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  build-review-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-assets-review
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Reuse successful legacy-photo audit artifact
        uses: actions/download-artifact@v4
        with:
          name: metom-legacy-photo-review
          path: legacy-review
          github-token: ${{ github.token }}
          repository: aviyansah-kly/metom
          run-id: 36374363474
      - name: Keep reviewed project photos and update review pages
        run: python scripts/prepare_legacy_portfolio.py
      - name: Commit generated assets only to review branch
        run: |
          rm -rf legacy-review
          git config user.name "Metom Portfolio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/legacy-projects index.html proyek.html kitchen-set-malang.html custom-furniture-malang.html interior-rumah-malang.html interior-komersial-malang.html
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "feat: add reviewed legacy project photography"
            git push origin portfolio-assets-review
          fi
