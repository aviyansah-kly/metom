name: Build reviewed legacy portfolio
on:
  push:
    branches:
      - portfolio-assets-review
    paths:
      - scripts/prepare_legacy_portfolio.py
      - .github/workflows/build-reviewed-legacy-portfolio.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-assets-review
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Collect legacy site photos
        run: python scripts/collect_legacy_photos.py
      - name: Keep only reviewed project photos and update review pages
        run: python scripts/prepare_legacy_portfolio.py
      - name: Commit generated review assets
        run: |
          rm -rf legacy-review
          git config user.name "Metom Portfolio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/legacy-projects index.html proyek.html kitchen-set-malang.html custom-furniture-malang.html interior-rumah-malang.html interior-komersial-malang.html
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "feat: add reviewed legacy project photography"
            git push origin portfolio-assets-review
          fi
