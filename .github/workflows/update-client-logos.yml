name: Refine client logo marquee

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-client-logos.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine client logo hover behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace("filter:grayscale(1);opacity:.68;transition:opacity .25s ease,filter .25s ease,transform .25s ease", "filter:none;opacity:.9;transition:opacity .25s ease,transform .25s ease")
          s = s.replace(".trust-logo:hover img{opacity:1;filter:grayscale(0);transform:scale(1.04)}", ".trust-logo:hover img{opacity:1;transform:scale(1.08)}")
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "refine: use full-color client logos with hover scale"
          git push
