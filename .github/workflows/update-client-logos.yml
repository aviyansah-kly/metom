name: Update client logo marquee

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-client-logos.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace client wordmarks with logo marquee
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          css_start = s.index('.client-marquee{')
          css_end = s.index('.insights{', css_start)
          new_css = '''.client-marquee{padding:58px 0 62px;background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden}.client-marquee-head{display:flex;align-items:end;justify-content:space-between;gap:30px;margin-bottom:34px}.client-marquee-head h2{font-size:28px;margin:8px 0 0}.client-marquee-head p{font-size:13px;margin:0;max-width:460px}.logo-marquee{position:relative;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 8%,#000 92%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 8%,#000 92%,transparent 100%)}.logo-track{display:flex;width:max-content;align-items:center;gap:64px;padding:5px 0;animation:clientScroll 28s linear infinite}.logo-marquee:hover .logo-track{animation-play-state:paused}.client-logo{width:170px;height:70px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:transparent;border:0;padding:0}.client-logo img{display:block;width:auto;height:auto;max-width:160px;max-height:48px;object-fit:contain;filter:grayscale(1);opacity:.64;transition:filter .3s ease,opacity .3s ease,transform .3s ease}.client-logo:hover img{filter:grayscale(0);opacity:1;transform:scale(1.04)}@keyframes clientScroll{from{transform:translate3d(0,0,0)}to{transform:translate3d(calc(-50% - 32px),0,0)}}\n'''
          s = s[:css_start] + new_css + s[css_end:]

          html_start = s.index('<section class="client-marquee"')
          html_end = s.index('<section class="insights"', html_start)
          clients = [
            ('alizzah-batu.sch.id', 'Al Izzah Leadership School'),
            ('malangstrudel.com', 'Malang Strudel'),
            ('charis.sch.id', 'Charis National Academy'),
            ('aia-financial.co.id', 'AIA Malang'),
            ('surabayapatata.com', 'Surabaya Patata'),
            ('mncfinance.com', 'MNC Finance Malang'),
          ]
          logos = ''.join(f'<div class="client-logo"><img src="https://logo.clearbit.com/{domain}?size=256" alt="{name}" loading="lazy"></div>' for domain,name in clients * 2)
          new_html = f'''<section class="client-marquee" aria-labelledby="client-title"><div class="wrap client-marquee-head"><div><div class="kicker">Klien</div><h2 id="client-title">Pernah dipercaya berbagai brand dan institusi.</h2></div><p>Beberapa klien yang pernah bekerja sama dengan Metom Design.</p></div><div class="logo-marquee" aria-label="Logo klien Metom Design"><div class="logo-track">{logos}</div></div></section>\n'''
          s = s[:html_start] + new_html + s[html_end:]

          s = s.replace('.client-logo{width:154px;height:78px;padding:14px 18px}.client-logo img{max-height:44px}', '.client-logo{width:142px;height:64px}.client-logo img{max-width:132px;max-height:42px}.logo-track{gap:42px}')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: show client logos in marquee"
          git push
