name: Homepage final QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-client-logos.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply homepage refinements
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<div class="number"><strong>2014</strong><span>Didirikan</span></div><div class="number"><strong>Malang</strong><span>Basis layanan</span></div><div class="number"><strong>1 Tim</strong><span>Design + Build</span></div>'
          new = '<div class="number"><strong>2014</strong><span>Mulai berkarya</span></div><div class="number"><strong>Malang</strong><span>Basis studio & layanan</span></div><div class="number"><strong>Skala Fleksibel</strong><span>Tim disesuaikan dengan kebutuhan proyek</span></div>'
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "refine: improve Metom capability stats"
          git push
