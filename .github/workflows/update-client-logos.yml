name: Homepage interaction QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-client-logos.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final interaction fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('.btn:hover{background-size:100% 100%;color:var(--btn-hover,#fff);border-color:var(--btn-fill,#151515);transform:translateY(-2px)}', '.btn:hover{background-size:100% 100%;color:var(--btn-hover,#fff)!important;border-color:var(--btn-fill,#151515);transform:translateY(-2px)}')
          s = s.replace('.btn--dark{--btn-fill:#fff;--btn-hover:#151515}', '.btn--dark{background-color:#151515;color:#fff;--btn-fill:#fff;--btn-hover:#151515}')
          s = s.replace('.hero .btn--dark{--btn-fill:#111;--btn-hover:#fff}', '.hero .btn--dark{background-color:#fff;color:#111;--btn-fill:#111;--btn-hover:#fff}')
          s = s.replace('.final-cta .btn--dark{--btn-fill:#111;--btn-hover:#fff}', '.final-cta .btn--dark{background-color:#fff;color:#111;--btn-fill:#111;--btn-hover:#fff}')
          s = s.replace('.final-cta .btn--dark{background-color:#fff;color:#111;--btn-fill:#111;--btn-hover:#fff}\n', '.final-cta .btn--dark{background-color:#fff;color:#111;--btn-fill:#111;--btn-hover:#fff}\n.case-copy .btn{--btn-fill:#fff;--btn-hover:#111}\n')
          s = s.replace('.wa-icon{width:34px;height:34px}}', '.wa-icon{width:34px;height:34px}.hero-actions{display:grid;grid-template-columns:1fr;gap:10px}.hero-actions .btn,.final-actions .btn{width:100%;min-height:50px}.numbers{grid-template-columns:1fr 1fr}.number:last-child{grid-column:1/-1}.number strong{font-size:30px}.mobile-open .nav-links{max-height:calc(100svh - 70px);overflow:auto}}')
          s = s.replace('</style>\n</head>', '@media(max-width:380px){.display{font-size:42px}.hero-inner{padding-top:118px}.numbers{grid-template-columns:1fr}.number:last-child{grid-column:auto}}\n</style>\n</head>')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "qa: fix inverse CTA hover and mobile layout"
          git push
