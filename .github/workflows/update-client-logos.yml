name: Update client logo marquee

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-client-logos.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace client logos with text marquee
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()

          css = '''.client-name{display:flex;align-items:center;justify-content:center;min-width:max-content;height:70px;padding:0 8px;font-size:20px;font-weight:400;letter-spacing:-.02em;color:#565954;white-space:nowrap;opacity:.78;transition:opacity .25s ease,color .25s ease}.client-name:hover{opacity:1;color:#171817}@media(max-width:640px){.client-name{font-size:17px;height:58px}}\n'''
          if '.client-name{' not in s:
              s = s.replace('.insights{', css + '.insights{', 1)

          start = s.index('<section class="client-marquee"')
          end = s.index('<section class="insights"', start)
          names = ['AIA','Surabaya Patata','Charis National Academy','MNC Finance','AL IZZAH Leadership School','Malang Strudel']
          items = ''.join(f'<div class="client-name">{n}</div>' for n in names * 2)
          section = f'''<section class="client-marquee" aria-labelledby="client-title"><div class="wrap client-marquee-head"><div><div class="kicker">Klien</div><h2 id="client-title">Pernah dipercaya berbagai brand dan institusi.</h2></div><p>Beberapa klien yang pernah bekerja sama dengan Metom Design.</p></div><div class="logo-marquee" aria-label="Daftar klien Metom Design"><div class="logo-track">{items}</div></div></section>\n'''
          s = s[:start] + section + s[end:]

          s = re.sub(r"\n\s*fetch\('assets/clients/client-logos\.png'.*?\n\s*\.catch\(function\(\)\{.*?\}\);\n", '\n', s, count=1, flags=re.S)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: temporarily use client names in marquee"
          git push
