name: Refine navigation labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-client-logos.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update navigation wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('<a href="#layanan">Layanan</a><a href="#proyek">Proyek</a><a href="#proses">Proses</a><a href="#wawasan">Wawasan</a><a href="#faq">FAQ</a>', '<a href="#layanan">Jasa Interior</a><a href="#proyek">Proyek</a><a href="#proses">Cara Kerja</a><a href="#wawasan">Tips Interior</a><a href="#faq">FAQ</a>')
          s = s.replace('>Konsultasi</a><button class="mobile-toggle"', '>Konsultasi WhatsApp</a><button class="mobile-toggle"')
          s = s.replace('<div class="footer-links"><a href="#layanan">Layanan</a><a href="#proyek">Proyek</a><a href="#proses">Proses</a><a href="#wawasan">Wawasan</a><a href="#faq">FAQ</a></div>', '<div class="footer-links"><a href="#layanan">Jasa Interior</a><a href="#proyek">Proyek</a><a href="#proses">Cara Kerja</a><a href="#wawasan">Tips Interior</a><a href="#faq">FAQ</a></div>')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "refine: optimize navigation labels for users and SEO"
          git push
