name: Deploy Metom to cPanel

on:
  push:
    branches:
      - production
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Deploy target"
        required: true
        default: "production"
        type: choice
        options:
          - production

concurrency:
  group: metom-cpanel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static site to cPanel
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: production

      - name: Validate required secrets
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_SSH_PASSPHRASE: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
        run: |
          test -n "$CPANEL_HOST" || (echo "Missing CPANEL_HOST" && exit 1)
          test -n "$CPANEL_USER" || (echo "Missing CPANEL_USER" && exit 1)
          test -n "$CPANEL_PORT" || (echo "Missing CPANEL_PORT" && exit 1)
          test -n "$CPANEL_SSH_KEY" || (echo "Missing CPANEL_SSH_KEY" && exit 1)
          test -n "$CPANEL_SSH_PASSPHRASE" || (echo "Missing CPANEL_SSH_PASSPHRASE" && exit 1)

      - name: Configure SSH
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_SSH_PASSPHRASE: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CPANEL_SSH_KEY" | tr -d '\r' > ~/.ssh/metom_deploy
          chmod 600 ~/.ssh/metom_deploy

          cat > ~/.ssh/askpass.sh <<'EOF'
          #!/bin/sh
          printf '%s\n' "$CPANEL_SSH_PASSPHRASE"
          EOF
          chmod 700 ~/.ssh/askpass.sh

          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          SSH_ASKPASS="$HOME/.ssh/askpass.sh" \
          SSH_ASKPASS_REQUIRE=force \
          DISPLAY=:0 \
          setsid ssh-add ~/.ssh/metom_deploy </dev/null

          echo "Deploy key fingerprint:"
          ssh-add -l
          ssh-keyscan -p "$CPANEL_PORT" "$CPANEL_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH authentication
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
        run: |
          ssh -vvv -o BatchMode=yes -p "$CPANEL_PORT" "$CPANEL_USER@$CPANEL_HOST" 'echo "SSH authentication OK"'

      - name: Prepare release on server
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
        run: |
          ssh -o BatchMode=yes -p "$CPANEL_PORT" "$CPANEL_USER@$CPANEL_HOST" \
            'mkdir -p ~/public_html/metom-static ~/metom-backups && if [ -d ~/public_html/metom-static ]; then tar -czf ~/metom-backups/metom-static-$(date +%Y%m%d-%H%M%S).tar.gz -C ~/public_html metom-static 2>/dev/null || true; fi'

      - name: Package website
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='deploy' \
            --exclude='wordpress' \
            --exclude='content' \
            --exclude='node_modules' \
            --exclude='wrangler.jsonc' \
            --exclude='.assetsignore' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='*.md' \
            -czf /tmp/metom-site.tar.gz .

      - name: Upload website package
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
        run: |
          scp -o BatchMode=yes -P "$CPANEL_PORT" \
            /tmp/metom-site.tar.gz \
            "$CPANEL_USER@$CPANEL_HOST:~/metom-site.tar.gz"

      - name: Extract website on server
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
        run: |
          ssh -o BatchMode=yes -p "$CPANEL_PORT" "$CPANEL_USER@$CPANEL_HOST" '
            set -e
            rm -rf ~/public_html/metom-static/*
            tar -xzf ~/metom-site.tar.gz -C ~/public_html/metom-static
            rm -f ~/metom-site.tar.gz
          '

      - name: Install production router
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
        run: |
          scp -o BatchMode=yes -P "$CPANEL_PORT" \
            deploy/public-root.htaccess \
            "$CPANEL_USER@$CPANEL_HOST:~/public_html/.htaccess"

      - name: Verify deployed files
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
        run: |
          ssh -i ~/.ssh/metom_deploy -p "$CPANEL_PORT" "$CPANEL_USER@$CPANEL_HOST" \
            'test -f ~/public_html/metom-static/index.html && test -f ~/public_html/metom-static/robots.txt && test -f ~/public_html/metom-static/sitemap.xml && test -f ~/public_html/.htaccess && echo "Metom production files are in place."'

      - name: Verify public SEO routes
        run: |
          set -euo pipefail

          assert_200() {
            url="$1"
            code="$(curl -sS -o /tmp/metom-response -w '%{http_code}' "$url")"
            test "$code" = "200" || (echo "Expected 200 for $url, got $code" && exit 1)
            echo "200 $url"
          }

          assert_200 "https://metom.id/"
          assert_200 "https://metom.id/blog/"
          assert_200 "https://metom.id/blog/harga-kitchen-set-malang/"
          assert_200 "https://metom.id/sitemap.xml"
          grep -q "https://metom.id/blog/" /tmp/metom-response || (echo "Sitemap does not contain /blog/" && exit 1)

          assert_200 "https://metom.id/robots.txt"
          grep -q "Sitemap: https://metom.id/sitemap.xml" /tmp/metom-response || (echo "robots.txt sitemap directive missing" && exit 1)

          headers="$(curl -sSI "https://metom.id/jurnal/")"
          echo "$headers" | grep -Eq '^HTTP/[^ ]+ 301' || (echo "Expected /jurnal/ to return 301" && exit 1)
          echo "$headers" | grep -Eqi '^location: /blog/?\r?$|^location: https://metom.id/blog/?\r? || (echo "Expected /jurnal/ to redirect to /blog/" && exit 1)

          homepage="$(curl -sS "https://metom.id/")"
          echo "$homepage" | grep -q 'meta name="robots" content="index,follow' || (echo "Homepage index/follow meta missing" && exit 1)
          echo "$homepage" | grep -q 'rel="canonical" href="https://metom.id/"' || (echo "Homepage canonical missing" && exit 1)
          echo "Public SEO route verification passed."
