name: Refine homepage section headings
on:
  push:
    paths:
      - '.github/workflows/refine-home-section-headings.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine section heading layouts
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          p = pathlib.Path('index.html')
          s = p.read_text()

          s = s.replace(
            '.services-head{display:grid;grid-template-columns:.8fr 1.2fr;gap:70px;align-items:end;margin-bottom:52px}.services-head .copy{max-width:640px;margin:0}',
            '.services-head{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr);gap:70px;align-items:end;margin-bottom:52px}.services-title{max-width:860px}.services-head .copy{max-width:560px;margin:0 0 4px auto}'
          )

          s = s.replace(
            '.why-grid{display:grid;grid-template-columns:.75fr 1.25fr;gap:80px}.why-list{border-top:1px solid var(--ink)}',
            '.why-head{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:70px;align-items:end;margin-bottom:52px}.why-head .h2{max-width:880px}.why-head .copy{max-width:560px;margin:0 0 4px auto}.why-grid{display:grid;grid-template-columns:.72fr 1.28fr;gap:80px;align-items:start}.why-list{border-top:1px solid var(--ink)}'
          )

          old_services = '''<section class="section" id="layanan"><div class="wrap"><div class="services-head"><div><div class="eyebrow">Layanan populer</div><h2 class="h2">Mulai dari kebutuhan ruang Anda.</h2></div><p class="copy">Pilih layanan sesuai kebutuhan—mulai dari desain interior, kitchen set, interior rumah dan kantor, custom furniture, hingga design & build.</p></div>'''
          new_services = '''<section class="section" id="layanan"><div class="wrap"><div class="services-head"><div class="services-title"><div class="eyebrow">Layanan populer</div><h2 class="h2">Mulai dari kebutuhan ruang Anda.</h2></div><p class="copy">Pilih layanan sesuai kebutuhan—mulai dari desain interior, kitchen set, interior rumah dan kantor, custom furniture, hingga design & build.</p></div>'''
          if old_services not in s:
              raise SystemExit('services block not found')
          s = s.replace(old_services, new_services, 1)

          old_why = '''<section class="section"><div class="wrap why-grid"><div><div class="eyebrow">Kenapa Metom</div><h2 class="h2">Fleksibel dari desain hingga pengerjaan.</h2><div class="numbers"><div class="number"><strong>2014</strong><span>Mulai berkarya</span></div><div class="number"><strong>Malang</strong><span>Basis studio & layanan</span></div><div class="number"><strong>Skala Fleksibel</strong><span>Tim disesuaikan dengan kebutuhan proyek</span></div></div></div><div class="why-list">'''
          new_why = '''<section class="section"><div class="wrap"><div class="why-head"><div><div class="eyebrow">Kenapa Metom</div><h2 class="h2">Fleksibel dari desain hingga pengerjaan.</h2></div><p class="copy">Pilih cara kerja yang paling sesuai dengan kebutuhan proyek Anda—mulai dari desain saja, pengerjaan berdasarkan desain yang sudah tersedia, hingga design & build dalam satu alur.</p></div><div class="why-grid"><div><div class="numbers"><div class="number"><strong>2014</strong><span>Mulai berkarya</span></div><div class="number"><strong>Malang</strong><span>Basis studio & layanan</span></div><div class="number"><strong>Skala Fleksibel</strong><span>Tim disesuaikan dengan kebutuhan proyek</span></div></div></div><div class="why-list">'''
          if old_why not in s:
              raise SystemExit('why block not found')
          s = s.replace(old_why, new_why, 1)

          # Close the additional wrap introduced for the Why Metom section.
          old_end = '''</div></div></section>\n<section class="section section--soft"><div class="wrap"><div class="room-head">'''
          new_end = '''</div></div></div></section>\n<section class="section section--soft"><div class="wrap"><div class="room-head">'''
          if old_end not in s:
              raise SystemExit('why section closing block not found')
          s = s.replace(old_end, new_end, 1)

          # Responsive handling for the new top-heading patterns.
          s = s.replace(
            '.services-head,.why-grid,.process-grid,.local-grid,.faq-grid,.final-grid{grid-template-columns:1fr;gap:38px}',
            '.services-head,.why-head,.why-grid,.process-grid,.local-grid,.faq-grid,.final-grid{grid-template-columns:1fr;gap:38px}.services-head .copy,.why-head .copy{margin:0;max-width:720px}'
          )
          s = s.replace(
            '.services-head{grid-template-columns:1fr;gap:24px}',
            '.services-head,.why-head{grid-template-columns:1fr;gap:24px}.services-head .copy,.why-head .copy{margin:0}'
          )

          p.write_text(s)
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/refine-home-section-headings.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/refine-home-section-headings.yml
          git commit -m "refine: improve homepage section heading hierarchy"
          git push