name: Final content consistency pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/content-consistency-final.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine live-ready wording and consistency
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  print(f'WARN not found in {path}: {old[:80]}')
              s = s.replace(old, new)
              p.write_text(s)

          # Homepage consistency
          rep('index.html', '<strong>Design + Build</strong><span>Satu tim terintegrasi</span>', '<strong>Skala Fleksibel</strong><span>Tim disesuaikan dengan kebutuhan proyek</span>')
          rep('index.html', 'Satu tim dari perencanaan desain sampai pengerjaan untuk menjaga kualitas hasil akhir.', 'Koordinasi desain dan pengerjaan dalam satu alur agar keputusan material, detail, dan pelaksanaan lebih terarah.')
          rep('index.html', '<span>Residential · Malang</span><strong>Residential Interior</strong>', '<span>Residential</span><strong>Pakuwon Residence</strong>')
          rep('index.html', '<span>Kitchen · Custom Furniture</span><strong>Kitchen & Cabinetry</strong>', '<span>Commercial · Malang</span><strong>Malang Strudel</strong>')
          rep('index.html', '<span>Office · Commercial</span><strong>Office Interior</strong>', '<span>Education · Batu</span><strong>AL IZZAH Leadership School</strong>')
          rep('index.html', '<a class="project-card reveal" href="#"><img src="https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&q=88&w=1600" alt="Residential interior modern">', '<a class="project-card reveal" href="proyek.html"><img src="https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&q=88&w=1600" alt="Ilustrasi interior hunian">')
          rep('index.html', '<a class="project-card reveal" href="#"><img src="https://images.unsplash.com/photo-1556912167-f556f1f39fdf?auto=format&fit=crop&q=88&w=1100" alt="Kitchen set modern">', '<a class="project-card reveal" href="proyek.html"><img src="https://images.unsplash.com/photo-1556912167-f556f1f39fdf?auto=format&fit=crop&q=88&w=1100" alt="Ilustrasi interior ruang komersial">')
          rep('index.html', '<a class="project-card reveal" href="#"><img src="https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&q=88&w=1100" alt="Office interior modern">', '<a class="project-card reveal" href="proyek-al-izzah.html"><img src="https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&q=88&w=1100" alt="Ilustrasi interior pendidikan">')
          rep('index.html', 'Project pendidikan menjadi contoh bagaimana Metom menangani kebutuhan interior yang bukan hanya visual, tetapi juga fungsi, durability, dan kebutuhan operasional ruang.', 'Proyek pendidikan ini menunjukkan bagaimana Metom mempertimbangkan fungsi ruang, ketahanan material, kebutuhan operasional, dan koordinasi pengerjaan dalam satu proses.')
          rep('index.html', '<span>Prototype V2 · SEO-first design direction</span>', '<span>Interior Design & Build · Malang</span>')

          # Service page: clearer Indonesian and align process
          rep('jasa-desain-interior-malang.html', 'Lihat Scope Layanan', 'Lihat Cakupan Layanan')
          rep('jasa-desain-interior-malang.html', 'Scope final disesuaikan dengan kebutuhan proyek, kondisi lapangan, dan tingkat detail yang dibutuhkan.', 'Cakupan akhir disesuaikan dengan kebutuhan proyek, kondisi lapangan, dan tingkat detail yang diperlukan.')
          rep('jasa-desain-interior-malang.html', 'Scope layanan', 'Cakupan layanan')
          rep('jasa-desain-interior-malang.html', 'layout, material, dan tampilan akhir', 'tata ruang, material, dan tampilan akhir')
          rep('jasa-desain-interior-malang.html', 'produksi dan build', 'produksi dan pengerjaan')
          rep('jasa-desain-interior-malang.html', 'scope dan spesifikasi', 'cakupan pekerjaan dan spesifikasi')
          rep('jasa-desain-interior-malang.html', 'Layout & zoning', 'Tata ruang & zoning')
          rep('jasa-desain-interior-malang.html', 'mood, komposisi warna', 'suasana, komposisi warna')
          rep('jasa-desain-interior-malang.html', 'dining area, built-in furniture', 'area makan, furnitur built-in')
          rep('jasa-desain-interior-malang.html', 'Workspace, reception, meeting area, retail', 'Area kerja, resepsionis, ruang rapat, retail')
          rep('jasa-desain-interior-malang.html', 'fungsi, durability, dan kebutuhan operasional', 'fungsi, ketahanan, dan kebutuhan operasional')
          old_process = '<div class="steps"><div class="step reveal"><b>01</b><h3>Konsultasi awal</h3><p>Diskusi kebutuhan, jenis ruang, lokasi, referensi, dan target penggunaan.</p></div><div class="step reveal"><b>02</b><h3>Survey</h3><p>Pengukuran dan pengecekan kondisi ruang bila diperlukan.</p></div><div class="step reveal"><b>03</b><h3>Pengembangan desain</h3><p>Layout, konsep, material, visualisasi, dan detail dikembangkan untuk direview.</p></div><div class="step reveal"><b>04</b><h3>Finalisasi</h3><p>Desain disesuaikan berdasarkan keputusan akhir sebelum masuk ke gambar kerja atau pengerjaan.</p></div></div>'
          new_process = '<div class="steps"><div class="step reveal"><b>01</b><h3>Konsultasi</h3><p>Diskusi kebutuhan, jenis ruang, lokasi, referensi, dan perkiraan anggaran awal.</p></div><div class="step reveal"><b>02</b><h3>Survey</h3><p>Pengukuran dan pengecekan kondisi lapangan sebagai dasar perencanaan.</p></div><div class="step reveal"><b>03</b><h3>Desain</h3><p>Tata ruang, konsep, material, visualisasi, dan detail desain dikembangkan untuk disepakati.</p></div><div class="step reveal"><b>04</b><h3>Proposal</h3><p>Cakupan pekerjaan, spesifikasi, waktu pengerjaan, dan biaya disusun sesuai kebutuhan proyek.</p></div><div class="step reveal"><b>05</b><h3>Produksi & Pengerjaan</h3><p>Jika memilih design & build, produksi furnitur dan pengerjaan lapangan dilakukan sesuai rencana yang disepakati.</p></div><div class="step reveal"><b>06</b><h3>Serah Terima</h3><p>Pengecekan akhir dilakukan sebelum pekerjaan diserahkan kepada klien. Untuk layanan desain saja, proses berakhir setelah dokumen desain final diserahkan.</p></div></div>'
          rep('jasa-desain-interior-malang.html', old_process, new_process)
          rep('jasa-desain-interior-malang.html', 'Dari konsultasi hingga desain siap digunakan.', 'Alur kerja yang jelas dari konsultasi sampai serah terima.')
          rep('jasa-desain-interior-malang.html', 'scope desain', 'cakupan desain')
          rep('jasa-desain-interior-malang.html', 'kebutuhan output', 'dokumen yang dibutuhkan')
          rep('jasa-desain-interior-malang.html', 'melalui skema design & build', 'melalui layanan design & build')

          # Project index: remove draft/meta language and generic fake projects
          rep('proyek.html', 'Kumpulan proyek hunian, pendidikan, kantor, dan ruang komersial yang menunjukkan cara Metom menerjemahkan kebutuhan ruang menjadi desain dan pengerjaan yang terukur.', 'Pilihan proyek Metom pada hunian, pendidikan, dan ruang komersial yang menunjukkan pengalaman kami menangani kebutuhan ruang dengan karakter yang berbeda.')
          rep('proyek.html', 'Setiap proyek menampilkan konteks ruang, lokasi, kategori, dan scope agar Anda lebih mudah memahami jenis pekerjaan yang ditangani Metom.', 'Lihat konteks ruang, lokasi, kategori, dan cakupan pekerjaan untuk memahami pengalaman Metom pada berbagai jenis proyek.')
          generic_start = '<a class="card reveal" href="#"><div class="card-media"><img src="https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&q=86&w=900" alt="Interior rumah modern Malang"></div><div class="meta">Residential · Malang</div><h3>Residential Interior</h3><p>Hunian dengan kebutuhan layout, storage, material, dan built-in furniture.</p></a><a class="card reveal" href="#"><div class="card-media"><img src="https://images.unsplash.com/photo-1556912167-f556f1f39fdf?auto=format&fit=crop&q=86&w=900" alt="Kitchen set modern Malang"></div><div class="meta">Kitchen · Custom Furniture</div><h3>Kitchen & Cabinetry</h3><p>Kitchen set dan cabinetry custom berdasarkan ukuran dan kebutuhan penyimpanan.</p></a><a class="card reveal" href="#"><div class="card-media"><img src="https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&q=86&w=900" alt="Interior kantor modern"></div><div class="meta">Office · Commercial</div><h3>Office Interior</h3><p>Ruang kerja dengan fokus pada fungsi, sirkulasi, dan kebutuhan aktivitas tim.</p></a><a class="card reveal" href="#"><div class="card-media"><img src="https://images.unsplash.com/photo-1505691938895-1758d7feb511?auto=format&fit=crop&q=86&w=900" alt="Interior komersial modern"></div><div class="meta">Commercial</div><h3>Commercial Interior</h3><p>Ruang usaha yang membutuhkan identitas visual sekaligus kebutuhan operasional.</p></a><a class="card reveal" href="#"><div class="card-media"><img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&q=86&w=900" alt="Interior rumah Malang"></div><div class="meta">Residential</div><h3>Home Interior</h3><p>Perencanaan interior rumah dengan pendekatan yang fleksibel sesuai scope proyek.</p></a>'
          confirmed = '<a class="card reveal" href="#"><div class="card-media"><img src="https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&q=86&w=900" alt="Ilustrasi interior hunian"></div><div class="meta">Residential</div><h3>Pakuwon Residence</h3><p>Proyek hunian yang menjadi bagian dari pengalaman Metom menangani kebutuhan interior residential.</p></a><a class="card reveal" href="#"><div class="card-media"><img src="https://images.unsplash.com/photo-1505691938895-1758d7feb511?auto=format&fit=crop&q=86&w=900" alt="Ilustrasi ruang komersial"></div><div class="meta">Commercial · Malang</div><h3>Malang Strudel</h3><p>Proyek ruang komersial di Malang yang menjadi bagian dari portfolio Metom.</p></a>'
          rep('proyek.html', generic_start, confirmed)
          rep('proyek.html', 'Selain foto, project detail akan menjelaskan lokasi, kategori, scope, kebutuhan ruang, pendekatan desain, material, serta informasi lain yang sudah dikonfirmasi untuk dipublikasikan.', 'Setiap halaman proyek merangkum konteks ruang, lokasi, kategori, cakupan pekerjaan, serta pendekatan yang digunakan selama proses desain dan pengerjaan.')
          rep('proyek.html', 'Dengan begitu, Anda bisa membandingkan proyek yang paling relevan sebelum menghubungi Metom untuk konsultasi.', 'Informasi tersebut membantu Anda melihat pengalaman Metom yang paling relevan dengan kebutuhan ruang Anda sebelum berkonsultasi.')

          # Project detail: remove prototype/placeholder wording and false photo implication
          rep('proyek-al-izzah.html', 'hubungan kerja yang berlanjut sebagai repeat client.', 'kerja sama yang berlanjut pada lebih dari satu kebutuhan proyek.')
          rep('proyek-al-izzah.html', '<div class="feature"><b>Status</b><h3 class="h3">Repeat Client</h3></div>', '<div class="feature"><b>Kerja sama</b><h3 class="h3">Proyek berkelanjutan</h3></div>')
          old_gallery = '<section class="section"><div class="wrap"><div class="section-head"><div><div class="eyebrow">Gallery proyek</div><h2 class="h2">Dokumentasi ruang & detail.</h2></div><p class="copy">Foto di prototype ini masih menggunakan placeholder dan akan diganti dengan dokumentasi proyek asli sebelum website dipublikasikan.</p></div><div class="project-grid"><div class="card"><div class="card-media"><img src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&q=86&w=900" alt="Placeholder dokumentasi proyek AL IZZAH 1"></div></div><div class="card"><div class="card-media"><img src="https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&q=86&w=900" alt="Placeholder dokumentasi proyek AL IZZAH 2"></div></div><div class="card"><div class="card-media"><img src="https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&q=86&w=900" alt="Placeholder dokumentasi proyek AL IZZAH 3"></div></div></div></div></section>'
          new_gallery = '<section class="section"><div class="wrap split"><div><div class="eyebrow">Kebutuhan proyek</div><h2 class="h2">Fungsi ruang dan kebutuhan operasional menjadi dasar keputusan.</h2></div><div><p class="copy">Lingkungan pendidikan membutuhkan ruang yang nyaman digunakan sehari-hari, mudah dirawat, dan tetap mendukung aktivitas penggunanya. Karena itu keputusan desain perlu mempertimbangkan fungsi, ketahanan material, alur penggunaan, dan kondisi lapangan.</p><p class="copy">Pendekatan tersebut menjadi dasar Metom dalam mengembangkan dan menjalankan pekerjaan interior untuk AL IZZAH Leadership School.</p></div></div></section>'
          rep('proyek-al-izzah.html', old_gallery, new_gallery)
          rep('proyek-al-izzah.html', 'alt="Proyek interior AL IZZAH Leadership School Batu"', 'alt="Ilustrasi interior pendidikan"')

          # Journal: remove internal SEO/editorial language
          rep('jurnal.html', 'Konten diarahkan untuk menjawab kebutuhan pencarian yang relevan, lalu menghubungkan pembaca ke layanan dan proyek Metom yang sesuai.', 'Pilih topik yang sesuai dengan kebutuhan Anda, mulai dari perkiraan biaya, material, perencanaan ruang, hingga persiapan sebelum konsultasi.')
          rep('jurnal.html', '<div class="eyebrow">Dari artikel ke keputusan</div><h2 class="h2">Konten bukan tujuan akhir.</h2>', '<div class="eyebrow">Butuh bantuan lebih lanjut?</div><h2 class="h2">Lanjutkan dari informasi ke kebutuhan ruang Anda.</h2>')
          rep('jurnal.html', 'Setiap artikel dibuat untuk membantu menjawab pertanyaan awal. Jika kebutuhannya sudah lebih jelas, Anda dapat melihat layanan terkait, proyek serupa, lalu melanjutkan ke konsultasi WhatsApp.', 'Setelah memahami pilihan yang tersedia, Anda dapat melihat layanan terkait, mempelajari proyek Metom, atau langsung berkonsultasi untuk membahas kondisi ruang Anda.')

          # Article: consistent Indonesian wording
          rep('harga-kitchen-set-malang.html', 'storage', 'penyimpanan')
          rep('harga-kitchen-set-malang.html', 'tall cabinet, island', 'kabinet tinggi, kitchen island')
          rep('harga-kitchen-set-malang.html', 'detail custom', 'detail khusus')
          rep('harga-kitchen-set-malang.html', 'scope pemasangan', 'cakupan pemasangan')
          rep('harga-kitchen-set-malang.html', 'budget awal', 'anggaran awal')

          # Avoid misleading image claims where images are still illustrative stock
          for f in ['jasa-desain-interior-malang.html','proyek.html','jurnal.html','harga-kitchen-set-malang.html']:
              p=Path(f); s=p.read_text(); s=s.replace('alt="Interior AL IZZAH Leadership School Batu"','alt="Ilustrasi interior pendidikan"'); p.write_text(s)

          PY
      - name: Validate public-facing copy
        run: |
          python - <<'PY'
          from pathlib import Path
          files=['index.html','jasa-desain-interior-malang.html','proyek.html','proyek-al-izzah.html','jurnal.html','harga-kitchen-set-malang.html']
          banned=['prototype','placeholder','akan memuat','di WordPress nanti','SEO-first design direction','Konten diarahkan untuk menjawab kebutuhan pencarian','Konten bukan tujuan akhir','Satu tim terintegrasi']
          for f in files:
              text=Path(f).read_text().lower()
              for b in banned:
                  assert b.lower() not in text, f'{f}: public-facing draft wording remains: {b}'
              assert text.count('<h1') == 1, f'{f}: must have one H1'
              assert '<meta name="description"' in text, f'{f}: missing description'
              assert 'konsultasi whatsapp' in text or 'konsultasi via whatsapp' in text, f'{f}: missing WhatsApp CTA'
          # Core positioning consistency
          home=Path('index.html').read_text()
          service=Path('jasa-desain-interior-malang.html').read_text()
          assert 'Konsultasi' in home and 'Survey' in home and 'Desain' in home and 'Proposal' in home and 'Produksi & Build' in home and 'Serah Terima' in home
          assert 'Konsultasi' in service and 'Survey' in service and 'Desain' in service and 'Proposal' in service and 'Produksi & Pengerjaan' in service and 'Serah Terima' in service
          assert 'Skala Fleksibel' in home
          print('Content consistency validation passed')
          PY
      - name: Commit refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html jasa-desain-interior-malang.html proyek.html proyek-al-izzah.html jurnal.html harga-kitchen-set-malang.html
          git diff --cached --quiet || git commit -m "content: make all pages live-ready and consistent"
          git push
