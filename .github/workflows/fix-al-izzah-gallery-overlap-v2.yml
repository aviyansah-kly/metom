name: Fix AL IZZAH gallery overlap v2
on:
  push:
    paths:
      - '.github/workflows/fix-al-izzah-gallery-overlap-v2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace gallery CSS with deterministic layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('proyek-al-izzah.html')
          s=p.read_text()
          old='.gallery-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:118px;gap:16px}.gallery-item{position:relative;overflow:hidden;background:#eee;margin:0;min-width:0}.gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.65,.25,1)}.gallery-item:hover img{transform:scale(1.025)}.gallery-item:nth-child(1){grid-column:1/8;grid-row:1/5}.gallery-item:nth-child(2){grid-column:8/13;grid-row:1/4}.gallery-item:nth-child(3){grid-column:8/10;grid-row:4/6}.gallery-item:nth-child(4){grid-column:10/13;grid-row:4/6}.gallery-item:nth-child(5){grid-column:1/9;grid-row:5/8}.gallery-item:nth-child(6){grid-column:9/11;grid-row:6/8}.gallery-item:nth-child(7){grid-column:11/13;grid-row:6/8}'
          new='.gallery-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:start}.gallery-item{position:relative;overflow:hidden;background:#eee;margin:0;min-width:0;width:100%}.gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.65,.25,1)}.gallery-item:hover img{transform:scale(1.025)}.gallery-item:nth-child(1){grid-column:1/8;aspect-ratio:7/5}.gallery-item:nth-child(2){grid-column:8/13;aspect-ratio:5/7}.gallery-item:nth-child(3){grid-column:1/7;aspect-ratio:4/3}.gallery-item:nth-child(4){grid-column:7/13;aspect-ratio:4/3}.gallery-item:nth-child(5){grid-column:1/-1;aspect-ratio:16/7}.gallery-item:nth-child(6){grid-column:1/7;aspect-ratio:4/3}.gallery-item:nth-child(7){grid-column:7/13;aspect-ratio:4/3}'
          if old not in s:
              raise SystemExit('desktop gallery CSS not found')
          s=s.replace(old,new)
          s=s.replace('.gallery-grid{grid-auto-rows:92px;gap:14px}', '.gallery-grid{gap:14px}')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proyek-al-izzah.html
          git diff --cached --quiet || git commit -m "fix: stabilize AL IZZAH gallery layout"
          git push
