name: Audit legacy Metom portfolio photos
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Collect original photos for visual review
        run: python3 scripts/collect_legacy_photos.py
      - name: Upload review archive (not published)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metom-legacy-photo-review
          path: legacy-review/
          retention-days: 14
          if-no-files-found: warn
