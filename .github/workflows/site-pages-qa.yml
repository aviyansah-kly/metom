name: Site pages QA

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'jasa-desain-interior-malang.html'
      - 'proyek.html'
      - 'proyek-al-izzah.html'
      - 'jurnal.html'
      - 'harga-kitchen-set-malang.html'
      - 'assets/detail.css'
      - 'assets/detail.js'
      - '.github/workflows/site-pages-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize homepage links
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<a href="#layanan">Jasa Interior</a><a href="#proyek">Proyek</a><a href="#proses">Cara Kerja</a><a href="#wawasan">Tips Interior</a><a href="#faq">FAQ</a>', '<a href="jasa-desain-interior-malang.html">Jasa Interior</a><a href="proyek.html">Proyek</a><a href="#proses">Cara Kerja</a><a href="jurnal.html">Tips Interior</a><a href="#faq">FAQ</a>')
          s=s.replace('<a class="service-card reveal" href="#"><span class="service-index">01</span><h3>Jasa Desain Interior Malang</h3>', '<a class="service-card reveal" href="jasa-desain-interior-malang.html"><span class="service-index">01</span><h3>Jasa Desain Interior Malang</h3>',1)
          s=s.replace('<a class="text-link" href="#">Lihat semua proyek', '<a class="text-link" href="proyek.html">Lihat semua proyek',1)
          s=s.replace('href="#">Lihat Case Study', 'href="proyek-al-izzah.html">Lihat Case Study',1)
          s=s.replace('<a class="text-link" href="#">Lihat semua artikel', '<a class="text-link" href="jurnal.html">Lihat semua artikel',1)
          s=s.replace('<div class="footer-links"><a href="#layanan">Jasa Interior</a><a href="#proyek">Proyek</a><a href="#proses">Cara Kerja</a><a href="#wawasan">Tips Interior</a><a href="#faq">FAQ</a></div>', '<div class="footer-links"><a href="jasa-desain-interior-malang.html">Jasa Interior</a><a href="proyek.html">Proyek</a><a href="#proses">Cara Kerja</a><a href="jurnal.html">Tips Interior</a><a href="#faq">FAQ</a></div>')
          p.write_text(s)
          PY
      - name: Validate pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          pages=['index.html','jasa-desain-interior-malang.html','proyek.html','proyek-al-izzah.html','jurnal.html','harga-kitchen-set-malang.html']
          errors=[]
          for f in pages:
              p=Path(f)
              if not p.exists(): errors.append(f'{f}: missing'); continue
              s=p.read_text()
              for token in ['<meta name="viewport"','<title>','<meta name="description"','<h1']:
                  if token not in s: errors.append(f'{f}: missing {token}')
              if len(re.findall(r'<h1(?:\s|>)',s))!=1: errors.append(f'{f}: must have exactly one h1')
              if f!='index.html' and 'rel="canonical"' not in s: errors.append(f'{f}: missing canonical')
              if 'noindex,nofollow' not in s: errors.append(f'{f}: prototype must remain noindex')
          css=Path('assets/detail.css').read_text()
          for token in ['@media(max-width:720px)','--btn-fill:#151515','--btn-fill:#fff','background-position:left bottom']:
              if token not in css: errors.append('detail.css: missing responsive/hover rule '+token)
          local=set(pages+['assets/detail.css','assets/detail.js'])
          for f in pages:
              s=Path(f).read_text()
              for href in re.findall(r'href="([^"]+)"',s):
                  if href.endswith('.html') and href not in local:
                      errors.append(f'{f}: broken local link {href}')
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print('QA passed for desktop/mobile structure, SEO essentials, local links, and inverse CTA hover rules.')
          PY
      - name: Commit homepage link updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "finalize: connect homepage to completed page templates"
          git push
