name: Minimal final CTA
on:
  push:
    paths:
      - '.github/workflows/minimal-final-cta.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify final CTA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          m=re.search(r'<section class="final-cta">.*?</section>',s,re.S)
          if not m: raise SystemExit('CTA not found')
          href=re.search(r'href="([^"]+)"',m.group(0))
          href=href.group(1) if href else '#'
          css='''
/* Minimal final CTA */
.final-cta{background:#151515;color:#fff;padding:96px 0;min-height:0;display:block}
.final-cta:after,.final-cta-media,.final-meta{display:none!important}
.final-cta-inner{width:min(100%,var(--max));margin:auto;padding:0 var(--pad);min-height:0;display:block}
.final-cta .eyebrow{color:#8f8f8f;margin-bottom:18px}
.final-cta .h2{max-width:760px;font-size:clamp(42px,4.6vw,64px);line-height:.98}
.final-cta .copy{color:#bdbdbd;max-width:560px;margin:22px 0 0;font-size:17px}
.final-actions{margin-top:30px;display:flex}
.final-actions .btn{width:auto}
@media(max-width:720px){.final-cta{padding:72px 0}.final-cta .h2{font-size:40px}.final-cta .copy{font-size:16px}.final-actions .btn{width:100%}}
'''
          s=s.replace('</style>',css+'\n</style>',1)
          new=f'''<section class="final-cta"><div class="final-cta-inner"><div class="eyebrow">Mulai proyek</div><h2 class="h2">Punya ruang yang ingin dikerjakan?</h2><p class="copy">Ceritakan kebutuhan dan lokasi proyek Anda. Tim Metom akan membantu menentukan langkah berikutnya.</p><div class="final-actions"><a class="btn btn--dark" href="{href}" target="_blank" rel="noopener">Konsultasi via WhatsApp<svg class="icon-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div></div></section>'''
          s=s[:m.start()]+new+s[m.end():]
          p.write_text(s)
          PY
      - name: Remove workflow
        run: rm .github/workflows/minimal-final-cta.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/minimal-final-cta.yml
          git commit -m "refine: simplify final CTA section"
          git push